
services:
  app:
    build: .
    image: idempotent-transaction-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/productivity
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: local_dev_password
    ports:
      - "8080:8080"

  postgres:
    image: postgres:17
    container_name: productivity-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: productivity
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d productivity"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: